[build]
  command = "npm run build"
  functions = "functions"
  publish = "dist"

[dev]
  # Local ports: 1234 and 5173 are used by other projects on this machine.
  framework = "#custom"
  command = "npm run vite"
  port = 7410
  targetPort = 7411

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200